# Once a month: check IRDAI for a newer insurance statistics handbook and, if found, rebuild the
# insurer comparison data and save it to this repository. No passwords or secrets needed.
name: Update insurance data

on:
  schedule:
    - cron: "0 6 3 * *"     # 3rd of every month, 11:30 am India time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_insurance.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insurance/*.csv data/insurance/*.json
          git diff --cached --quiet || (git commit -m "Monthly insurance data check" && git push)
