# Runs every weekday at about 5:00 pm India time (11:30 UTC), even when your laptop is off.
# Needs repository secrets: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (and/or EMAIL_ADDRESS, EMAIL_APP_PASSWORD, EMAIL_TO).
name: Daily stock alerts

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_alerts.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
