# Runs every weekday at about 5:00 pm India time (11:30 UTC), even when your laptop is off.
# The report is posted as an issue in this repository, so GitHub notifies/emails you.
# No passwords or secrets are needed.
name: Daily stock alerts

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_alerts.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
